name: Request a COMSC110 repo
description: Get your personal repo for a COMSC110 assignment. Register first if you have not.
title: "request-comsc110: "
body:
  - type: markdown
    attributes:
      value: |
        ### Request your COMSC110 assignment repo
        Pick the assignment. Your GitHub username is captured automatically.
        Not registered yet? Open the **Register** form first.
  - type: dropdown
    id: assignment
    attributes:
      label: Assignment
      description: (Auto-generated from config.json — do not hand-edit.)
      options:
        - A00
        - A21
        - A22
        - A23
        - A24
        - A25
        - A26
        - A31
        - A32
        - A33
        - A34
        - A35
        - A41
        - A42
        - A43
        - A44
        - Q3Q1
        - W25
    validations:
      required: true
  - type: input
    id: access_code
    attributes:
      label: Access code
      description: Quizzes and exams ONLY — leave this blank for regular assignments. The code is inside the quiz on Canvas.
    validations:
      required: false
